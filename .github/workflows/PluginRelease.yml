name: Plugin Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update metadata.yaml version
        run: |
          echo "更新 metadata.yaml 版本为： ${{ github.ref_name }}"
          yq -i ".version = \"${{ github.ref_name }}\"" metadata.yaml

      - name: Create Version Bump Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/bump-version-${{ github.ref_name }}
          base: master
          delete-branch: true
          commit-message: "chore: bump version to ${{ github.ref_name }}"
          title: "chore: bump version to ${{ github.ref_name }}"
          body: |
            Automatically update `metadata.yaml` to `${{ github.ref_name }}`.

            This PR was created by the Plugin Release workflow.

      - name: Extract Latest Changelog Section
        id: changelog_reader
        run: |
          echo "${{ github.ref_name }} 的更新内容..."
          sed -n "/^## ${{ github.ref_name }}/,/^## v/p" CHANGELOG.md | sed '1d;$d' > release_notes.txt
          echo "更新内容如下："
          cat release_notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.txt
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
